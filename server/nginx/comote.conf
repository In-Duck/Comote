server {
    listen 80;
    server_name 131-186-62-61.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 131-186-62-61.sslip.io;

    root /srv/comote;
    location / {
        try_files $uri $uri/ =404;
    }

    ssl_certificate /etc/letsencrypt/live/131-186-62-61.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/131-186-62-61.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
