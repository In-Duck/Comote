name: Build Comote Virtual HID

on:
  push:
    branches:
      - agent/complete-comote-prototype
    paths:
      - "Driver/**"
      - "Directory.Build.props"
      - "packages.config"
      - ".github/workflows/virtual-hid.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: packages
          key: wdk-10.0.28000.1839-x64

      - uses: nuget/setup-nuget@v2

      - uses: microsoft/setup-msbuild@v2
        with:
          vs-prerelease: true
          msbuild-architecture: x64

      - name: Restore WDK packages
        shell: pwsh
        run: nuget restore packages.config -PackagesDirectory packages

      - name: Build x64 driver
        shell: pwsh
        run: |
          $wdkBin = (Resolve-Path `
            "packages/Microsoft.Windows.WDK.x64.10.0.28000.1839/c/bin/10.0.28000.0").Path
          $env:PATH = "$wdkBin\x64;$wdkBin\x86;$env:PATH"
          msbuild Driver/ComoteVirtualHid.sln `
            /m `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:SignMode=Off `
            "/p:WDKBinRoot=$wdkBin" `
            "/p:InfToolPath=$wdkBin\x64" `
            "/p:Inf2CatToolPath=$wdkBin\x86"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish installer
        shell: pwsh
        run: >-
          dotnet publish Driver/Installer/ComoteVirtualHidInstaller.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o artifacts/ComoteVirtualHid

      - name: Collect driver package
        shell: pwsh
        run: |
          $output = "artifacts/ComoteVirtualHid"
          Get-ChildItem Driver/ComoteVirtualHid -Recurse `
            -Include ComoteVirtualHid.sys,ComoteVirtualHid.inf,ComoteVirtualHid.cat | `
            Copy-Item -Destination $output -Force

      - name: Test-sign team driver package
        shell: pwsh
        run: |
          $output = (Resolve-Path "artifacts/ComoteVirtualHid").Path
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=Comote Team Test Driver $env:GITHUB_RUN_ID" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -KeyAlgorithm RSA `
            -KeyLength 3072 `
            -HashAlgorithm SHA256 `
            -KeyExportPolicy NonExportable `
            -NotAfter (Get-Date).AddDays(90)
          Export-Certificate `
            -Cert $certificate `
            -FilePath "$output/ComoteTeamTest.cer" | Out-Null

          $signTool = (Resolve-Path `
            "packages/Microsoft.Windows.SDK.CPP.10.0.28000.1839/c/bin/10.0.28000.0/x64/signtool.exe").Path
          & $signTool sign /v /fd SHA256 /sha1 $($certificate.Thumbprint) `
            /s My "$output/ComoteVirtualHid.cat"
          if ($LASTEXITCODE -ne 0) { throw "Catalog test signing failed." }

          $signature = Get-AuthenticodeSignature `
            -LiteralPath "$output/ComoteVirtualHid.cat"
          if ($null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
            throw "Catalog signature does not match the generated team certificate."
          }

          Copy-Item Driver/Installer/Install-Team-TestDriver.ps1 $output
          Copy-Item Driver/Installer/Disable-Team-TestMode.ps1 $output
          Copy-Item "Driver/Installer/Install Team Test Driver as Administrator.cmd" $output
          Copy-Item "Driver/Installer/Remove Team Test Driver and Disable Test Mode.cmd" $output
          Copy-Item Driver/TEST_MODE_GUIDE_KO.md $output

      - uses: actions/upload-artifact@v4
        with:
          name: ComoteVirtualHid-test-signed-team-build
          path: artifacts/ComoteVirtualHid
          if-no-files-found: error
          retention-days: 90
