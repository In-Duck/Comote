name: Validate Preview Packages

on:
  push:
    branches:
      - main
      - agent/complete-comote-prototype
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build manager and client
        shell: pwsh
        run: ./Distribution/Build_Hub_Packages.ps1

      - name: Resolve release metadata
        id: release_metadata
        shell: pwsh
        run: |
          [xml]$project = Get-Content Host/Host.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Host project version is missing."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify release packages
        shell: pwsh
        env:
          VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          $assets = @(
            "artifacts/ComoteManager-$env:VERSION-win-x64.zip",
            "artifacts/ComoteClient-$env:VERSION-win-x64.zip",
            "artifacts/Comote-$env:VERSION-win-x64.zip"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Release package is missing: $asset"
            }
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $asset
            Write-Host "$($hash.Hash)  $asset"
          }

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          $assets = @(
            "artifacts/ComoteManager-$env:VERSION-win-x64.zip",
            "artifacts/ComoteClient-$env:VERSION-win-x64.zip",
            "artifacts/Comote-$env:VERSION-win-x64.zip"
          )
          $tag = "v$env:VERSION"

          if (gh release view $tag 2>$null) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets `
              --target "${{ github.sha }}" `
              --title "Comote $env:VERSION" `
              --prerelease `
              --generate-notes
          }
