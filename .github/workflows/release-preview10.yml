name: Release Preview 18

on:
  push:
    branches:
      - main
      - agent/complete-comote-prototype
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build manager and client
        shell: pwsh
        run: ./Distribution/Build_Hub_Packages.ps1

      - name: Create separate download packages
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/Comote-1.6.0-preview.18/Manager/* `
            -DestinationPath artifacts/ComoteManager-1.6.0-preview.18-win-x64.zip `
            -CompressionLevel Optimal
          Compress-Archive `
            -Path artifacts/Comote-1.6.0-preview.18/Client/* `
            -DestinationPath artifacts/ComoteClient-1.6.0-preview.18-win-x64.zip `
            -CompressionLevel Optimal

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/agent/complete-comote-prototype'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "artifacts/ComoteManager-1.6.0-preview.18-win-x64.zip",
            "artifacts/ComoteClient-1.6.0-preview.18-win-x64.zip",
            "artifacts/Comote-1.6.0-preview.18-win-x64.zip"
          )

          if (gh release view "v1.6.0-preview.18" 2>$null) {
            gh release upload "v1.6.0-preview.18" $assets --clobber
          } else {
            gh release create "v1.6.0-preview.18" $assets `
              --target "${{ github.sha }}" `
              --title "Comote 1.6.0 Preview 18" `
              --prerelease `
              --notes "Fixes FakerInput detection on 64-bit Windows by reading SP_DEVICE_INTERFACE_DETAIL_DATA.DevicePath from its correct 4-byte offset while retaining the architecture-specific cbSize. Separately detects the official FakerInput root interface so diagnostics distinguish a loaded root driver from a missing HID control collection. Includes the signed FakerInput v0.1.1 installer. Virtual input compatibility with every game or anti-cheat is not guaranteed."
          }
