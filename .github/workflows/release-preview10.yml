name: Release Preview 14

on:
  push:
    branches:
      - main
      - agent/complete-comote-prototype
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build manager and client
        shell: pwsh
        run: ./Distribution/Build_Hub_Packages.ps1

      - name: Create separate download packages
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/Comote-1.6.0-preview.14/Manager/* `
            -DestinationPath artifacts/ComoteManager-1.6.0-preview.14-win-x64.zip `
            -CompressionLevel Optimal
          Compress-Archive `
            -Path artifacts/Comote-1.6.0-preview.14/Client/* `
            -DestinationPath artifacts/ComoteClient-1.6.0-preview.14-win-x64.zip `
            -CompressionLevel Optimal

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/agent/complete-comote-prototype'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "artifacts/ComoteManager-1.6.0-preview.14-win-x64.zip",
            "artifacts/ComoteClient-1.6.0-preview.14-win-x64.zip",
            "artifacts/Comote-1.6.0-preview.14-win-x64.zip"
          )

          if (gh release view "v1.6.0-preview.14" 2>$null) {
            gh release upload "v1.6.0-preview.14" $assets --clobber
          } else {
            gh release create "v1.6.0-preview.14" $assets `
              --target "${{ github.sha }}" `
              --title "Comote 1.6.0 Preview 14" `
              --notes "Account-first release candidate: Client and Manager discover devices through the same account without VPN address or port entry. Includes the official signed FakerInput v0.1.1 installer with pinned SHA-256 verification, SendInput fallback, configurable TURN, bounded verified file transfer, and hardened input cleanup. Virtual input compatibility with every game or anti-cheat is not guaranteed."
          }
