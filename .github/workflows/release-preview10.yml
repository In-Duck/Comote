name: Release Preview 15

on:
  push:
    branches:
      - main
      - agent/complete-comote-prototype
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build manager and client
        shell: pwsh
        run: ./Distribution/Build_Hub_Packages.ps1

      - name: Create separate download packages
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/Comote-1.6.0-preview.15/Manager/* `
            -DestinationPath artifacts/ComoteManager-1.6.0-preview.15-win-x64.zip `
            -CompressionLevel Optimal
          Compress-Archive `
            -Path artifacts/Comote-1.6.0-preview.15/Client/* `
            -DestinationPath artifacts/ComoteClient-1.6.0-preview.15-win-x64.zip `
            -CompressionLevel Optimal

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/agent/complete-comote-prototype'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "artifacts/ComoteManager-1.6.0-preview.15-win-x64.zip",
            "artifacts/ComoteClient-1.6.0-preview.15-win-x64.zip",
            "artifacts/Comote-1.6.0-preview.15-win-x64.zip"
          )

          if (gh release view "v1.6.0-preview.15" 2>$null) {
            gh release upload "v1.6.0-preview.15" $assets --clobber
          } else {
            gh release create "v1.6.0-preview.15" $assets `
              --target "${{ github.sha }}" `
              --title "Comote 1.6.0 Preview 15" `
              --prerelease `
              --notes "Fixes initial connection retries, releases local input immediately when the control window loses focus, restores cloud thumbnails, and removes placeholder context-menu commands. Includes the signed FakerInput v0.1.1 installer and SendInput fallback. Virtual input compatibility with every game or anti-cheat is not guaranteed."
          }
