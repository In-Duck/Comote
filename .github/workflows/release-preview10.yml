name: Release Preview 10

on:
  push:
    branches:
      - main
      - agent/complete-comote-prototype

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build manager and client
        shell: pwsh
        run: ./Distribution/Build_Hub_Packages.ps1

      - name: Create separate download packages
        shell: pwsh
        run: |
          Compress-Archive `
            -Path artifacts/Comote-1.6.0-preview.10/Manager/* `
            -DestinationPath artifacts/ComoteManager-1.6.0-preview.10-win-x64.zip `
            -CompressionLevel Optimal
          Compress-Archive `
            -Path artifacts/Comote-1.6.0-preview.10/Client/* `
            -DestinationPath artifacts/ComoteClient-1.6.0-preview.10-win-x64.zip `
            -CompressionLevel Optimal

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "artifacts/ComoteManager-1.6.0-preview.10-win-x64.zip",
            "artifacts/ComoteClient-1.6.0-preview.10-win-x64.zip",
            "artifacts/Comote-1.6.0-preview.10-win-x64.zip"
          )

          if (gh release view "v1.6.0-preview.10" 2>$null) {
            gh release upload "v1.6.0-preview.10" $assets --clobber
          } else {
            gh release create "v1.6.0-preview.10" $assets `
              --target "${{ github.sha }}" `
              --title "Comote 1.6.0 Preview 10" `
              --notes "Testable Manager and Client preview packages for local and LAN prototype validation."
          }